name: Nightly Safety Audit

on:
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight UTC

jobs:
  nightly-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout neurocore code
        uses: actions/checkout@v4
        with:
          path: neurocore

      - name: Checkout OMNIBUS code
        uses: actions/checkout@v4
        with:
          repository: jonnysteedman683-wq/OMNIBUS
          path: OMNIBUS

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Check drift in OMNIBUS/lib/neurocore-swarm.ts vs main
        run: |
          if ! diff neurocore/lib/neurocore-swarm.ts OMNIBUS/lib/neurocore-swarm.ts; then
            echo "::error::Drift detected in neurocore-swarm.ts between neurocore and OMNIBUS"
            exit 1
          fi

      - name: Run integration test against live decoder service
        run: |
          cd neurocore
          npm install
          node --test tests/
name: Safety Audit

on:
  pull_request:
    paths:
      - 'contracts/*.ts'
      - 'lib/neurocore-swarm.ts'
      - 'lib/safety_gate.ts'
      - 'lib/mcp_neurocore.ts'

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run Safety Audit Script
        run: |
          C:/Users/jonny/AppData/Local/hermes/scripts/neurocore-safety-audit.bat
      - '**/neurocore-neural-decoder/**'
jobs:
  audit:
    runs-on: self-hosted
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Safety Audit
        run: C:/Users/jonny/AppData/Local/hermes/scripts/neurocore-safety-audit.bat
      - name: Comment PR Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Neurocore suite passed'
            })
      - name: Comment PR Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Neurocore safety audit failed.'
            })
      - '../neurocore-neural-decoder/**'

jobs:
  audit:
    name: Run Safety Audit
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Run audit script
        run: |
          C:/Users/jonny/AppData/Local/hermes/scripts/neurocore-safety-audit.bat
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Execute safety audit script (blocks merge on failure)
        run: C:/Users/jonny/AppData/Local/hermes/scripts/neurocore-safety-audit.bat
