name: Neurocore CI
name: Neurocore CI / Integration Test

on:
  pull_request:
    paths:
      - 'contracts/*.ts'
      - 'lib/neurocore-swarm.ts'
      - 'lib/safety_gate.ts'
      - 'lib/mcp_neurocore.ts'
      - '../neurocore-neural-decoder/**'
  schedule:
    - cron: '0 0 * * *' # Nightly

jobs:
  test_and_comment:
    if: github.event_name == 'pull_request'
      - 'neurocore-neural-decoder/**' # Note: Assuming this is mapped or moved to standard repo

permissions:
  pull-requests: write
  issues: write

jobs:
  test-and-audit:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        id: tests
        run: node --test tests/
        continue-on-error: true

      - name: Run safety audit
        id: audit
        run: C:/Users/jonny/AppData/Local/hermes/scripts/neurocore-safety-audit.bat
        continue-on-error: true

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const testPassed = "${{ steps.tests.outcome }}" === "success";
            const auditPassed = "${{ steps.audit.outcome }}" === "success";

            if (testPassed && auditPassed) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "✅ Neurocore suite passed"
              });
            } else {
              let msg = "Failures:\n";
              if (!testPassed) msg += "- Tests failed\n";
              if (!auditPassed) msg += "- Safety audit failed\n";
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: msg
              });
            }

      - name: Block merge if safety audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1
      - '**/neurocore-neural-decoder/**'
  schedule:
    - cron: '0 0 * * *'
jobs:
  pr-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install tsx typescript @types/node || true
      - run: node --import tsx --test tests/
  nightly:
    if: github.event_name == 'schedule'
      - '../neurocore-neural-decoder/**'
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  neurocore-test:
    if: github.event_name == 'pull_request'
    name: Neurocore Suite
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install # adjust depending on if lockfile exists

      - name: Run tests
        id: test_run
        run: node --import tsx --test tests/ > test_output.txt 2>&1
        continue-on-error: true

      - name: Comment on PR (Success)
        if: steps.test_run.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Neurocore suite passed'
            })

      - name: Comment on PR (Failure)
        if: steps.test_run.outcome != 'success'
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          rm -f package-lock.json
        run: npm install && rm -f package-lock.json
        run: npm install

      - name: Run tests
        id: test
        run: |
          if node --test tests/ > test_output.log 2>&1; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = fs.readFileSync('test_output.txt', 'utf8');
            if (output.length > 65000) {
              output = output.substring(0, 65000) + '\n... [output truncated]';
            const status = '${{ steps.test.outputs.status }}';
            let body = '';
            if (status === 'passed') {
              body = '✅ Neurocore suite passed';
            } else {
              let logs = 'Could not read logs.';
              if (fs.existsSync('test_output.log')) {
                logs = fs.readFileSync('test_output.log', 'utf8').substring(0, 60000);
              }
              body = `❌ Neurocore suite failed:\n\n\`\`\`\n${logs}\n\`\`\``;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Neurocore suite failed:\n```\n' + output + '\n```'
            })

      - name: Fail job if tests failed
        if: steps.test_run.outcome != 'success'
        run: exit 1

  nightly_integration:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Neurocore
        uses: actions/checkout@v4
        with:
          path: neurocore

      - name: Checkout OMNIBUS
        uses: actions/checkout@v4
        with:
          repository: jonnysteedman683-wq/OMNIBUS
          path: OMNIBUS

      - name: Check OMNIBUS drift
        run: |
          if ! diff OMNIBUS/lib/neurocore-swarm.ts neurocore/lib/neurocore-swarm.ts; then
            echo "::error::SwarmRuntimeEngine API mismatch detected: drift between neurocore/lib/neurocore-swarm.ts and OMNIBUS/lib/neurocore-swarm.ts"
            exit 1
          fi

      - name: Run integration test against live decoder service
        run: |
          cd neurocore
          echo "Running integration tests against live decoder service"
          # Assuming there's a specific script for this, for now run tests.
          npm ci || npm install
          node --import tsx --test tests/integration/ # Or specific integration test file if it exists, otherwise full suite or mock.
              body: body
            });

      - name: Fail workflow if tests failed
        if: steps.test.outputs.status == 'failed'
        run: exit 1

  nightly-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Nightly Safety + Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: neurocore
      - uses: actions/checkout@v4
        with:
          repository: jonnysteedman683-wq/OMNIBUS
          path: OMNIBUS
      - name: Check drift vs main
        run: diff OMNIBUS/lib/neurocore-swarm.ts neurocore/lib/neurocore-swarm.ts || echo "Drift detected"
      - name: Alert on SwarmRuntimeEngine API mismatch
        run: |
          if ! grep -q "SwarmRuntimeEngine" OMNIBUS/lib/neurocore-swarm.ts; then
            echo "SwarmRuntimeEngine API mismatch detected!"
            exit 1
          fi
      - name: Run integration test against live decoder service
        run: |
          cd neurocore
          npm install tsx typescript @types/node || true
          node --import tsx --test tests/neurocore_integration.test.ts
          fetch-depth: 0
          path: neurocore

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: jonnysteedman683-wq/OMNIBUS
          path: OMNIBUS

      - name: Check SwarmRuntimeEngine API
        run: |
          echo "Checking OMNIBUS SwarmRuntimeEngine API compatibility..."
          if ! diff OMNIBUS/lib/neurocore-swarm.ts neurocore/lib/neurocore-swarm.ts > /dev/null; then
            echo "::error::API mismatch detected between OMNIBUS/lib/neurocore-swarm.ts and neurocore/lib/neurocore-swarm.ts"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Full Integration Test
        working-directory: neurocore
        run: |
          echo "Running full end-to-end test with decoder service..."
          npm install
          rm -f package-lock.json
          npm install && rm -f package-lock.json
          npm install
          npm run test
          node --test tests/

      - name: Report Results
        run: |
          echo "Nightly audit completed"

      - name: Alert on Failure
        if: failure()
        run: |
          echo "::warning::Neurocore nightly audit FAILED - manual intervention required"
