name: Neurocore CI / Integration Test

on:
  pull_request:
    paths:
      - 'contracts/*.ts'
      - 'lib/neurocore-swarm.ts'
      - 'lib/safety_gate.ts'
      - 'lib/mcp_neurocore.ts'
      - '**/neurocore-neural-decoder/**'
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  neurocore-test:
    if: github.event_name == 'pull_request'
    name: Neurocore Suite
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: test
        run: |
          if npm run test > test_output.log 2>&1; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.test.outputs.status }}';
            let body = '';
            if (status === 'passed') {
              body = '✅ Neurocore suite passed';
            } else {
              let logs = 'Could not read logs.';
              if (fs.existsSync('test_output.log')) {
                logs = fs.readFileSync('test_output.log', 'utf8').substring(0, 60000);
              }
              body = `❌ Neurocore suite failed:\n\n\`\`\`\n${logs}\n\`\`\``;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail workflow if tests failed
        if: steps.test.outputs.status == 'failed'
        run: exit 1

  nightly-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Nightly Safety + Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: neurocore

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: jonnysteedman683-wq/OMNIBUS
          path: OMNIBUS

      - name: Check SwarmRuntimeEngine API
        run: |
          echo "Checking OMNIBUS SwarmRuntimeEngine API compatibility..."
          if ! diff OMNIBUS/lib/neurocore-swarm.ts neurocore/lib/neurocore-swarm.ts > /dev/null; then
            echo "::error::API mismatch detected between OMNIBUS/lib/neurocore-swarm.ts and neurocore/lib/neurocore-swarm.ts"
            exit 1
          fi

      - name: Run Full Integration Test
        working-directory: neurocore
        run: |
          echo "Running full end-to-end test with decoder service..."
          npm ci
          npm run test

      - name: Report Results
        run: |
          echo "Nightly audit completed"

      - name: Alert on Failure
        if: failure()
        run: |
          echo "::warning::Neurocore nightly audit FAILED - manual intervention required"
