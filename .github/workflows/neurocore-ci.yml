name: Neurocore CI

on:
  pull_request:
    paths:
      - 'contracts/*.ts'
      - 'lib/neurocore-swarm.ts'
      - 'lib/safety_gate.ts'
      - 'lib/mcp_neurocore.ts'
      - '../neurocore-neural-decoder/**'
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install
          rm -f package-lock.json
      - name: Run tests
        id: run_tests
        run: node --test tests/ > test_output.txt 2>&1
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_output.txt

  audit:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Run safety audit
        run: C:/Users/jonny/AppData/Local/hermes/scripts/neurocore-safety-audit.bat

  report:
    if: always() && github.event_name == 'pull_request'
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Download test logs
        if: needs.test.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: test-logs
          path: .
        continue-on-error: true
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = "${{ needs.test.result }}";
            const auditResult = "${{ needs.audit.result }}";

            if (testResult === 'success' && auditResult === 'success') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ Neurocore suite passed'
              });
            } else {
              let msg = "❌ Failures:\n";
              if (testResult !== 'success') {
                msg += "- Tests failed\n";
                const fs = require('fs');
                if (fs.existsSync('test_output.txt')) {
                  let output = fs.readFileSync('test_output.txt', 'utf8');
                  if (output.length > 60000) {
                    output = output.substring(0, 60000) + '\n... [output truncated]';
                  }
                  msg += "```\n" + output + "\n```\n";
                }
              }
              if (auditResult !== 'success') {
                msg += "- Safety audit failed\n";
              }
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: msg
              });
            }
      - name: Fail workflow if needed
        if: needs.test.result != 'success' || needs.audit.result != 'success'
        run: exit 1

  nightly-integration:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout neurocore
        uses: actions/checkout@v4
        with:
          path: neurocore
      - name: Checkout OMNIBUS
        uses: actions/checkout@v4
        with:
          repository: jonnysteedman683-wq/OMNIBUS
          path: OMNIBUS
      - name: Check drift
        run: |
          echo "Running API drift check between neurocore and OMNIBUS..."
          if ! diff OMNIBUS/lib/neurocore-swarm.ts neurocore/lib/neurocore-swarm.ts > /dev/null; then
            echo "::error::SwarmRuntimeEngine API mismatch detected: drift between neurocore/lib/neurocore-swarm.ts and OMNIBUS/lib/neurocore-swarm.ts"
            exit 1
          fi
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run integration test against live decoder service
        working-directory: neurocore
        run: |
          npm install
          rm -f package-lock.json
          node --test tests/
