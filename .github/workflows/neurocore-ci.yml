name: Neurocore CI

on:
  pull_request:
    paths:
      - 'contracts/*.ts'
      - 'lib/neurocore-swarm.ts'
      - 'lib/safety_gate.ts'
      - 'lib/mcp_neurocore.ts'
      - '**/neurocore-neural-decoder/**'
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install tsx typescript @types/node
      - name: Run Tests
        run: node --import tsx --test tests/
        id: tests
      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const body = success ? '✅ Neurocore suite passed' : '❌ Neurocore suite failed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout neurocore
        uses: actions/checkout@v4
        with:
          path: neurocore
      - name: Checkout OMNIBUS
        uses: actions/checkout@v4
        with:
          repository: jonnysteedman683-wq/OMNIBUS
          path: omnibus
      - name: Check API drift
        run: |
          if ! cmp -s neurocore/lib/neurocore-swarm.ts omnibus/lib/neurocore-swarm.ts; then
            echo "API mismatch detected between neurocore and OMNIBUS"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Integration Tests
        env:
          LIVE_DECODER_SERVICE: true
        run: |
          cd neurocore
          npm install tsx typescript @types/node
          node --import tsx --test tests/neurocore_integration.test.ts
