name: Neurocore Integration Test

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'lib/neurocore-swarm.ts'
      - 'core/safety_gate.ts'
      - 'core/dispatcher.ts'
      - 'scripts/mcp-server.ts'
      - 'adapters/neural-decoder/**'
      - 'tests/**'
      - '.github/workflows/neurocore-ci.yml'

jobs:
  neurocore-test:
    name: Neurocore Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install
        working-directory: ./

      - name: Run Neurocore Tests
        run: node --import tsx --test tests/ --test-reporter=spec

      - name: Run Safety Audit
        run: |
          echo "Running safety audit..."
          # Check for prohibited patterns
          if grep -rE "(process\.env\.|eval\(|new Function\(|readFileSync.*features|requiresConfirmation.*false)" lib/ --include="*.ts" --include="*.js"; then
            echo "::error::Prohibited pattern detected in adapter code"
            exit 1
          fi
          echo "Safety audit passed"

      - name: Post Review Summary
        run: |
          echo "Neurocore integration suite completed successfully"
        if: always()
