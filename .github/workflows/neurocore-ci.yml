name: Neurocore CI

on:
  pull_request:
    paths:
      - 'contracts/*.ts'
      - 'lib/neurocore-swarm.ts'
      - 'lib/safety_gate.ts'
      - 'lib/mcp_neurocore.ts'
      - '../neurocore-neural-decoder/**'
  schedule:
    - cron: '0 0 * * *' # Nightly
  workflow_dispatch:

jobs:
  test:
    name: Full Suite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        id: tests
        run: node --test tests/ > test_output.txt 2>&1
        continue-on-error: true

      - name: Comment on PR (Success)
        if: steps.tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Neurocore suite passed'
            })

      - name: Comment on PR (Failure)
        if: steps.tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'Logs unavailable';
            if (fs.existsSync('test_output.txt')) {
              output = fs.readFileSync('test_output.txt', 'utf8').substring(0, 60000);
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ Neurocore suite failed\n\n\`\`\`\n${output}\n\`\`\``
            })
            core.setFailed('Tests failed');

  nightly-drift-check:
    name: Nightly Swarm API Drift Check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Neurocore
        uses: actions/checkout@v4
        with:
          path: neurocore

      - name: Checkout OMNIBUS
        uses: actions/checkout@v4
        with:
          repository: jonnysteedman683-wq/OMNIBUS
          path: omnibus

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Drift
        run: |
          echo "Running API drift check between neurocore and OMNIBUS..."
          if ! diff omnibus/lib/neurocore-swarm.ts neurocore/lib/neurocore-swarm.ts > /dev/null; then
            echo "::error::API mismatch detected between OMNIBUS/lib/neurocore-swarm.ts and neurocore/lib/neurocore-swarm.ts"
            exit 1
          fi

          cd neurocore
          npm install
          echo "Running integration test..."
          if node --test tests/ > integration_output.log 2>&1; then
            echo "Integration tests passed"
          else
            echo "::error::Integration tests failed"
            cat integration_output.log
            exit 1
          fi
