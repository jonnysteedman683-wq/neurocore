name: Neurocore CI / Integration Test

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'lib/neurocore-swarm.ts'
      - 'core/safety_gate.ts'
      - 'core/dispatcher.ts'
      - 'scripts/mcp-server.ts'
      - 'adapters/neural-decoder/**'
      - 'tests/**'
      - '.github/workflows/neurocore-ci.yml'

jobs:
  neurocore-test:
    name: Neurocore Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
