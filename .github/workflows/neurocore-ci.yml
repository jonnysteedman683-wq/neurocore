name: Neurocore CI

on:
  pull_request:
    paths:
      - 'contracts/*.ts'
      - 'lib/neurocore-swarm.ts'
      - 'lib/safety_gate.ts'
      - 'lib/mcp_neurocore.ts'
      - '../neurocore-neural-decoder/**'

permissions:
  pull-requests: write
  issues: write

jobs:
  test-and-audit:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          npm install
          rm -f package-lock.json

      - name: Run tests
        id: tests
        shell: bash
        run: node --test tests/ > test_output.txt 2>&1
        continue-on-error: true

      - name: Run safety audit
        id: audit
        shell: cmd
        run: C:/Users/jonny/AppData/Local/hermes/scripts/neurocore-safety-audit.bat
        continue-on-error: true

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const testPassed = "${{ steps.tests.outcome }}" === "success";
            const auditPassed = "${{ steps.audit.outcome }}" === "success";

            if (testPassed && auditPassed) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "✅ Neurocore suite passed"
              });
            } else {
              let msg = "Failures:\n";
              if (!testPassed) msg += "- Tests failed\n";
              if (!auditPassed) msg += "- Safety audit failed\n";
              const fs = require('fs');
              if (fs.existsSync('test_output.txt')) {
                let output = fs.readFileSync('test_output.txt', 'utf8');
                if (output.length > 60000) {
                  output = output.substring(0, 60000) + '\n... [output truncated]';
                }
                msg += '\n```\n' + output + '\n```';
              }
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: msg
              });
            }

      - name: Block merge if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1

      - name: Block merge if safety audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1
