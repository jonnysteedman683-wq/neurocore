name: Neurocore CI/CD

on:
  pull_request:
    paths:
      - 'contracts/*.ts'
      - 'lib/neurocore-swarm.ts'
      - 'lib/safety_gate.ts'
      - 'lib/mcp_neurocore.ts'
      - '../neurocore-neural-decoder/**'
  schedule:
    - cron: '0 0 * * *' # Nightly
  workflow_dispatch:

jobs:
  pr-tests:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, windows]
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          rm -f package-lock.json

      - name: Run Tests
        id: tests
        run: node --test tests/ > test_output.txt 2>&1
        continue-on-error: true

      - name: Run Safety Audit
        id: audit
        run: C:/Users/jonny/AppData/Local/hermes/scripts/neurocore-safety-audit.bat
        continue-on-error: true

      - name: Comment on PR (Success)
        if: steps.tests.outcome == 'success' && steps.audit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Neurocore suite passed'
            })

      - name: Comment on PR (Failure)
        if: steps.tests.outcome != 'success' || steps.audit.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let testOutput = 'No test logs available';
            if (fs.existsSync('test_output.txt')) {
              testOutput = fs.readFileSync('test_output.txt', 'utf8').substring(0, 60000);
            }

            let message = '❌ Neurocore suite failed\n';
            if ('${{ steps.tests.outcome }}' != 'success') {
              message += '\n**Test Failures:**\n```\n' + testOutput + '\n```\n';
            }
            if ('${{ steps.audit.outcome }}' != 'success') {
              message += '\n**Safety Audit Failed**\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: Fail workflow if audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1

      - name: Fail workflow if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1

  nightly-checks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout neurocore code
        uses: actions/checkout@v4
        with:
          path: neurocore

      - name: Checkout OMNIBUS code
        uses: actions/checkout@v4
        with:
          repository: jonnysteedman683-wq/OMNIBUS
          path: OMNIBUS

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check drift in OMNIBUS/lib/neurocore-swarm.ts vs main
        run: |
          echo "Running API drift check between neurocore and OMNIBUS..."
          if ! diff OMNIBUS/lib/neurocore-swarm.ts neurocore/lib/neurocore-swarm.ts > /dev/null; then
            echo "::error::SwarmRuntimeEngine API mismatch detected: drift between neurocore/lib/neurocore-swarm.ts and OMNIBUS/lib/neurocore-swarm.ts"
            exit 1
          fi

      - name: Run integration test against live decoder service
        working-directory: neurocore
        run: |
          npm install
          rm -f package-lock.json
          node --test tests/
